<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="COMODOspese">
<meta name="theme-color" content="#0e0e0e">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>
<title>COMODOspese</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap">
<style>
/* Layout: credito verde fisso in alto, tre blocchi macro che si aprono in micro e sottocategorie, report a tutta pagina, schede dal basso per inserire dati. */
:root{
  --bg:#0e0e0e; --surface:#171717; --surface2:#1e1e1d; --line:#2a2a28; --fg:#f3f2ee; --muted:#8e8d86;
  --yellow:#F6B100; --yellow-ink:#111111; --green:#52C97A; --red:#FF6B5E;
  --green-bg:#13231a; --green-line:#2b4a38; --scrim:rgba(0,0,0,.62);
  --display:'Oswald','Arial Narrow',Impact,sans-serif; --body:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--body);font-size:15px;line-height:1.4;color:var(--fg);background:var(--bg);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px}
.credits{display:flex;align-items:center;gap:14px;width:100%;background:linear-gradient(135deg,var(--green-bg),#101010);border:1px solid var(--green-line);border-radius:18px;padding:14px 16px}
.coin{flex:none;width:46px;height:46px;border-radius:50%;background:var(--yellow);color:var(--yellow-ink);font:700 26px/1 var(--display);display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.ctext{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.clabel{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cval{font:600 36px/1 var(--display);letter-spacing:.01em;color:var(--green);overflow-wrap:anywhere}
.cval.neg{color:var(--red)}
.cgo{flex:none;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--yellow);font-weight:600}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.arrow{width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:22px;display:grid;place-items:center;text-align:center}
.mlabel{flex:1;text-align:center;font:600 18px var(--display);letter-spacing:.1em;text-transform:uppercase;min-height:44px}

/* Macro */
main{padding-block:6px 120px}
.macro{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.mhead{display:flex;align-items:center;gap:12px;width:100%;padding:16px;min-height:64px}
.mname{flex:1;min-width:0;font:600 19px var(--display);letter-spacing:.09em;text-transform:uppercase}
.tot{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.tbig{font:600 22px/1 var(--display)}
.tbig.in{color:var(--green)}
.tsmall{font-size:12px;color:var(--muted)}
.chev{flex:none;width:12px;color:var(--muted);font-size:20px;transition:transform .15s}
.open>.mhead .chev,.open>.uhead .chev{transform:rotate(90deg)}
.mbody{border-top:1px solid var(--line)}
.micro{border-bottom:1px solid var(--line)}
.micro:last-of-type{border-bottom:0}
.uhead{display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;min-height:56px}
.uname{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.uname.s{font-weight:500}
.ubody{background:var(--surface2);padding:4px 16px 14px}
.sub{margin-top:6px;padding-left:12px;border-left:1px dashed var(--line)}
.sub .uhead{padding:10px 0 10px 8px;min-height:48px}
.sub .ubody{background:none;padding:0 0 8px 8px}
.day{margin-top:8px}
.dayhead{display:flex;justify-content:space-between;gap:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 0 2px}
.entry{display:flex;align-items:baseline;justify-content:space-between;gap:12px;width:100%;padding:10px 0;border-top:1px solid var(--line);min-height:44px}
.entry .amt{font-weight:600;white-space:nowrap}
.entry .note{flex:1;min-width:0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.hint{color:var(--muted);font-size:13px;padding:10px 0}
.acts{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.chip.pri{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.macro-acts{padding:12px 16px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}

/* Sheet */
.backdrop{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92%;overflow-y:auto;background:var(--surface);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h2{margin:0 0 14px;font:600 20px var(--display);letter-spacing:.08em;text-transform:uppercase}
.sheet h2 small{display:block;font:400 12px var(--body);letter-spacing:.04em;text-transform:none;color:var(--muted);margin-top:4px}
.sheet label{display:block;margin:12px 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sheet input,.sheet select,.sheet textarea{width:100%;min-height:48px;padding:10px 12px;font:16px var(--body);color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:12px}
.sheet textarea{resize:vertical}
.sheet input[type=date]{min-width:0;-webkit-appearance:none;appearance:none}
.err{min-height:20px;margin-top:8px;color:var(--red);font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.btn.pri{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink);flex:1}
.btn.del{color:var(--red);margin-left:auto}
.btn.del.armed{background:var(--red);border-color:var(--red);color:#111}

/* Report */
.rtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:flex;align-items:center;gap:12px}
.back{min-height:44px;padding:0 14px 0 6px;font-weight:600;color:var(--yellow)}
.rtitle{font:600 20px var(--display);letter-spacing:.1em;text-transform:uppercase}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-top:6px}
.seg button{min-height:42px;border-radius:10px;text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--yellow);color:var(--yellow-ink)}
.seg.two{grid-template-columns:1fr 1fr}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}
.range{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.range label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.range input{width:100%;min-width:0;min-height:48px;padding:10px 12px;font:16px var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;-webkit-appearance:none;appearance:none}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.box .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.box .v{font:600 24px/1.1 var(--display);margin-top:6px;overflow-wrap:anywhere}
.box.diff{grid-column:1/-1;background:linear-gradient(135deg,var(--green-bg),#101010);border-color:var(--green-line)}
.box.diff .v{font-size:38px;color:var(--green)}
.box.diff.neg .v{color:var(--red)}
.v.in{color:var(--green)}
.v.out{color:var(--yellow)}
.sec{margin-top:24px}
.sec h3{margin:0 0 10px;font:600 15px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brow{padding:8px 0}
.brow .l{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.brow .l span:first-child{min-width:0;overflow-wrap:anywhere}
.brow.m .l{font-weight:600}
.brow.s{padding-left:14px;color:var(--muted);font-size:13px}
.bar{display:block;height:6px;border-radius:3px;background:var(--surface2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--yellow);border-radius:3px}
.bar.in i{background:var(--green)}
.macrohd{display:flex;justify-content:space-between;gap:10px;font:600 17px var(--display);letter-spacing:.08em;text-transform:uppercase;margin-top:14px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.moves{list-style:none;margin:0;padding:0}
.moves li{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.mdate{flex:none;width:44px;font-size:12px;color:var(--muted);text-transform:uppercase}
.mwho{flex:1;min-width:0}
.mwho b{font-weight:600}
.mwho small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.mamt{flex:none;font-weight:600;white-space:nowrap}
.mamt.in{color:var(--green)}
.empty{color:var(--muted);padding:14px 0}
.foot{margin-top:28px;color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--red);color:#111;font-weight:600;padding:10px 16px;border-radius:999px;font-size:13px;max-width:90%}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>

<div id="topbar" class="top gut"></div>
<main id="home" class="gut"></main>
<section id="report" class="gut" hidden></section>
<div id="sheetwrap" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
var MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
var MESI_S=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
var GIORNI=['dom','lun','mar','mer','gio','ven','sab'];
var LS_KEY='comodo-spese-v1';

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var NF=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'});
function fmt(c){return NF.format(c/100);}
function pad(n){return n<10?'0'+n:''+n;}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return ymd(new Date());}
function parseD(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function dayLabel(s){var d=parseD(s);return GIORNI[d.getDay()]+' '+d.getDate()+' '+MESI_S[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'');}
function shortDay(s){var d=parseD(s);return d.getDate()+' '+MESI_S[d.getMonth()];}
function monthLabel(k){var p=k.split('-');return MESI[+p[1]-1]+' '+p[0];}
function shiftMonth(k,n){var p=k.split('-');var d=new Date(+p[0],+p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function parseAmt(s){
  s=String(s).replace(/\s|€/g,''); if(!s) return NaN;
  if(s.indexOf(',')>-1){s=s.replace(/\./g,'').replace(',','.');}
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)){s=s.replace(/\./g,'');}
  var v=parseFloat(s); if(!isFinite(v)||v<=0) return NaN;
  return Math.round(v*100);
}
function amtToInput(c){return (c/100).toFixed(2).replace('.',',');}

/* ---------- Stato ---------- */
function mk(name,subs){var a=[];for(var i=0;subs&&i<subs.length;i++)a.push({id:uid(),name:subs[i]});return {id:uid(),name:name,subs:a};}
function defTree(){return [
  {id:'casa',name:'Casa',micros:[mk('Affitto / Mutuo'),mk('Bollette'),mk('Spesa alimentare')]},
  {id:'altre',name:'Altre spese',micros:[mk('Trasporti'),mk('Svago'),mk('Salute')]},
  {id:'entrate',name:'Entrate',micros:[mk('Lavoro personale',['PT']),mk('Dipendente',['Urban','Virgin Active'])]}
];}
var S={tree:defTree(),settings:{mode:'month'},entries:[]};
var now=new Date();
var ui={view:'home',month:ymd(now).slice(0,7),open:{},sheet:null,
  rep:{p:'month',month:ymd(now).slice(0,7),year:String(now.getFullYear()),from:ymd(new Date(now.getFullYear(),now.getMonth(),now.getDate()-30)),to:ymd(now)}};

function loadLocal(){try{var r=localStorage.getItem(LS_KEY);if(r){var o=JSON.parse(r);if(o&&o.tree&&o.entries){S.tree=o.tree;S.entries=o.entries;S.settings=o.settings||{mode:'month'};return true;}}}catch(e){}return false;}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}}

function macro(k){for(var i=0;i<S.tree.length;i++)if(S.tree[i].id===k)return S.tree[i];return null;}
function micro(k,id){var m=macro(k);if(!m)return null;for(var i=0;i<m.micros.length;i++)if(m.micros[i].id===id)return m.micros[i];return null;}
function subOf(mi,id){if(!mi)return null;for(var i=0;i<mi.subs.length;i++)if(mi.subs[i].id===id)return mi.subs[i];return null;}
function entryById(id){for(var i=0;i<S.entries.length;i++)if(S.entries[i].id===id)return S.entries[i];return null;}
function sum(pred){var t=0;for(var i=0;i<S.entries.length;i++){if(pred(S.entries[i]))t+=S.entries[i].a;}return t;}

/* ---------- Salvataggio (cloud se disponibile, altrimenti solo dispositivo) ---------- */
var P={ref:null,uid:null,dirty:{},busy:false,mode:'local',unsub:null,seen:false};
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true;},3500);}
function docKey(k){return k;}
function buildDoc(key){
  if(key==='tree') return {tree:S.tree,settings:S.settings};
  var m=key.slice(2),list=[];
  for(var i=0;i<S.entries.length;i++){if(S.entries[i].d.slice(0,7)===m)list.push(S.entries[i]);}
  return list.length?{entries:list}:null;
}
function markDirty(keys){
  saveLocal();
  for(var i=0;i<keys.length;i++)P.dirty[keys[i]]=1;
  flush();
}
function flush(){
  if(P.mode!=='cloud'||P.busy)return;
  var ks=Object.keys(P.dirty); if(!ks.length)return;
  var key=ks[0]; delete P.dirty[key]; P.busy=true;
  var ref=P.ref(key),body=buildDoc(key),p=body===null?ref.delete():ref.set(body);
  p.then(function(){P.busy=false;flush();},function(){P.busy=false;P.dirty[key]=1;toast('Salvataggio non riuscito, riprovo');setTimeout(flush,5000);});
}
function pushAll(){
  var months={};for(var i=0;i<S.entries.length;i++)months['m-'+S.entries[i].d.slice(0,7)]=1;
  markDirty(['tree'].concat(Object.keys(months)));
}
function onSnap(snap){
  if(snap.empty&&snap.metadata&&snap.metadata.fromCache)return;
  if(P.busy||Object.keys(P.dirty).length)return;
  if(snap.empty){ if(!P.seen){P.seen=true;pushAll();} return; }
  P.seen=true;
  var tree=null,settings=null,entries=[];
  snap.docs.forEach(function(d){
    var data=d.data()||{};
    if(d.id==='tree'){tree=data.tree;settings=data.settings;}
    else if(d.id.indexOf('m-')===0&&data.entries){entries=entries.concat(data.entries);}
  });
  if(tree)S.tree=JSON.parse(JSON.stringify(tree));
  if(settings)S.settings=JSON.parse(JSON.stringify(settings));
  S.entries=JSON.parse(JSON.stringify(entries));
  saveLocal();
  if(!ui.sheet)render();
  if(!tree)markDirty(['tree']);
}
function initCloud(){
  if(!window.claude||!window.claude.use)return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],u=r[1]; if(!db||!u)return null;
    return u.id().then(function(id){
      if(!id)return;
      var base='data/users/'+id;
      P.ref=function(key){return db.doc(base+'/'+key);};
      P.mode='cloud';
      P.unsub=db.collection(base).onSnapshot(onSnap,function(){P.mode='local';render();});
      render();
    });
  }).catch(function(){});
}

/* ---------- Calcoli ---------- */
function tm(){return ui.month;}
function balance(){
  var inc=0,exp=0;
  for(var i=0;i<S.entries.length;i++){var e=S.entries[i];
    if(S.settings.mode==='month'&&e.d.slice(0,7)!==ui.month)continue;
    if(e.k==='entrate')inc+=e.a;else exp+=e.a;}
  return inc-exp;
}
function dayGroups(list){
  list=list.slice().sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0;});
  var out=[],cur=null;
  for(var i=0;i<list.length;i++){
    if(!cur||cur.d!==list[i].d){cur={d:list[i].d,items:[],tot:0};out.push(cur);}
    cur.items.push(list[i]);cur.tot+=list[i].a;
  }
  return out;
}
function totHtml(month,day,isIn){
  return '<span class="tot num"><span class="tbig'+(isIn?' in':'')+'">'+fmt(month)+'</span><span class="tsmall">oggi '+fmt(day)+'</span></span>';
}

/* ---------- Render Home ---------- */
function renderTop(){
  var b=balance(),lab=S.settings.mode==='month'?'Ancora disponibili · '+MESI_S[+ui.month.slice(5)-1]+' '+ui.month.slice(0,4):'Ancora disponibili · totale';
  document.getElementById('topbar').innerHTML=
   '<button class="credits" data-act="report" aria-label="Apri il report">'+
   '<span class="coin" aria-hidden="true">€</span>'+
   '<span class="ctext"><span class="clabel">'+esc(lab)+'</span><span class="cval num'+(b<0?' neg':'')+'">'+fmt(b)+'</span></span>'+
   '<span class="cgo">Report ›</span></button>'+
   '<div class="monthbar"><button class="arrow" data-act="mprev" aria-label="Mese precedente">‹</button>'+
   '<button class="mlabel" data-act="mnow" aria-label="Torna al mese corrente">'+esc(monthLabel(ui.month))+'</button>'+
   '<button class="arrow" data-act="mnext" aria-label="Mese successivo">›</button></div>';
}
function entriesHtml(list){
  var g=dayGroups(list),h='';
  for(var i=0;i<g.length;i++){
    h+='<div class="day"><div class="dayhead num"><span>'+esc(dayLabel(g[i].d))+'</span><span>'+fmt(g[i].tot)+'</span></div>';
    for(var j=0;j<g[i].items.length;j++){var e=g[i].items[j];
      h+='<button class="entry" data-act="editE" data-id="'+e.id+'"><span class="amt num">'+fmt(e.a)+'</span><span class="note">'+esc(e.n||'')+'</span></button>';}
    h+='</div>';
  }
  return h;
}
function renderHome(){
  var t=today(),h='';
  for(var i=0;i<S.tree.length;i++){
    var M=S.tree[i],isIn=M.id==='entrate',kM='M:'+M.id,open=ui.open[kM];
    var mMonth=sum(function(e){return e.k===M.id&&e.d.slice(0,7)===ui.month;});
    var mDay=sum(function(e){return e.k===M.id&&e.d===t;});
    h+='<section class="macro'+(open?' open':'')+'"><button class="mhead" data-act="tog" data-key="'+kM+'" aria-expanded="'+(open?'true':'false')+'"><span class="mname">'+esc(M.name)+'</span>'+totHtml(mMonth,mDay,isIn)+'<span class="chev" aria-hidden="true">›</span></button>';
    if(open){
      h+='<div class="mbody">';
      for(var j=0;j<M.micros.length;j++){
        var mi=M.micros[j],kU='m:'+mi.id,uo=ui.open[kU];
        var uMonth=sum(function(e){return e.m===mi.id&&e.d.slice(0,7)===ui.month;});
        var uDay=sum(function(e){return e.m===mi.id&&e.d===t;});
        h+='<div class="micro'+(uo?' open':'')+'"><button class="uhead" data-act="tog" data-key="'+kU+'" aria-expanded="'+(uo?'true':'false')+'"><span class="uname">'+esc(mi.name)+'</span>'+totHtml(uMonth,uDay,isIn&&false)+'<span class="chev" aria-hidden="true">›</span></button>';
        if(uo){
          h+='<div class="ubody">';
          var direct=[],k;
          for(k=0;k<S.entries.length;k++){var e=S.entries[k];if(e.m===mi.id&&!e.s&&e.d.slice(0,7)===ui.month)direct.push(e);}
          h+=entriesHtml(direct);
          for(k=0;k<mi.subs.length;k++){
            var sb=mi.subs[k],kS='s:'+sb.id,so=ui.open[kS];
            var sMonth=sum(function(e){return e.s===sb.id&&e.d.slice(0,7)===ui.month;});
            var sDay=sum(function(e){return e.s===sb.id&&e.d===t;});
            h+='<div class="sub'+(so?' open':'')+'"><button class="uhead" data-act="tog" data-key="'+kS+'" aria-expanded="'+(so?'true':'false')+'"><span class="uname s">'+esc(sb.name)+'</span>'+totHtml(sMonth,sDay,false)+'<span class="chev" aria-hidden="true">›</span></button>';
            if(so){
              var sl=[];for(var q=0;q<S.entries.length;q++){var e2=S.entries[q];if(e2.s===sb.id&&e2.d.slice(0,7)===ui.month)sl.push(e2);}
              h+='<div class="ubody">'+(sl.length?entriesHtml(sl):'<div class="hint">Nessuna voce in questo mese.</div>')+
                 '<div class="acts"><button class="chip pri" data-act="addE" data-k="'+M.id+'" data-m="'+mi.id+'" data-s="'+sb.id+'">'+(isIn?'+ Entrata':'+ Spesa')+'</button>'+
                 '<button class="chip" data-act="editS" data-k="'+M.id+'" data-m="'+mi.id+'" data-id="'+sb.id+'">Modifica</button></div></div>';
            }
            h+='</div>';
          }
          if(!direct.length&&!mi.subs.length)h+='<div class="hint">Nessuna voce in questo mese.</div>';
          h+='<div class="acts"><button class="chip pri" data-act="addE" data-k="'+M.id+'" data-m="'+mi.id+'" data-s="">'+(isIn?'+ Entrata':'+ Spesa')+'</button>'+
             '<button class="chip" data-act="addS" data-k="'+M.id+'" data-m="'+mi.id+'">+ Sottocategoria</button>'+
             '<button class="chip" data-act="editM" data-k="'+M.id+'" data-id="'+mi.id+'">Modifica</button></div></div>';
        }
        h+='</div>';
      }
      h+='<div class="macro-acts"><button class="chip" data-act="addM" data-k="'+M.id+'">+ Microcategoria</button></div></div>';
    }
    h+='</section>';
  }
  document.getElementById('home').innerHTML=h;
}

/* ---------- Report ---------- */
function bounds(){
  var r=ui.rep;
  if(r.p==='month')return {from:r.month+'-01',to:r.month+'-31',label:monthLabel(r.month)};
  if(r.p==='year')return {from:r.year+'-01-01',to:r.year+'-12-31',label:r.year};
  if(r.p==='all')return {from:'0000-00-00',to:'9999-99-99',label:'Totale assoluto'};
  var f=r.from||'0000-00-00',t=r.to||'9999-99-99';
  return {from:f<=t?f:t,to:f<=t?t:f,label:(r.from?shortDay(r.from):'…')+' → '+(r.to?shortDay(r.to):'…')};
}
function pathOf(e){
  var M=macro(e.k),mi=micro(e.k,e.m),sb=subOf(mi,e.s);
  var s=(M?M.name:'?')+' › '+(mi?mi.name:'?');if(sb)s+=' › '+sb.name;return s;
}
function renderReport(){
  var r=ui.rep,b=bounds(),list=[],i;
  for(i=0;i<S.entries.length;i++){var e=S.entries[i];if(e.d>=b.from&&e.d<=b.to)list.push(e);}
  var inc=0,exp=0;
  for(i=0;i<list.length;i++){if(list[i].k==='entrate')inc+=list[i].a;else exp+=list[i].a;}
  var diff=inc-exp;
  var h='<div class="rtop"><button class="back" data-act="home">‹ Indietro</button><span class="rtitle">Report</span></div>';
  h+='<div class="seg" role="tablist">'+
    '<button class="'+(r.p==='month'?'on':'')+'" data-act="rp" data-p="month">Mese</button>'+
    '<button class="'+(r.p==='year'?'on':'')+'" data-act="rp" data-p="year">Anno</button>'+
    '<button class="'+(r.p==='all'?'on':'')+'" data-act="rp" data-p="all">Totale</button>'+
    '<button class="'+(r.p==='range'?'on':'')+'" data-act="rp" data-p="range">Da – a</button></div>';
  if(r.p==='month'||r.p==='year'){
    h+='<div class="pnav"><button class="arrow" data-act="rprev" aria-label="Precedente">‹</button><span class="mlabel">'+esc(b.label)+'</span><button class="arrow" data-act="rnext" aria-label="Successivo">›</button></div>';
  }else if(r.p==='range'){
    h+='<div class="range"><div><label for="r-from">Dal</label><input type="date" id="r-from" data-in="from" value="'+esc(r.from)+'"></div><div><label for="r-to">Al</label><input type="date" id="r-to" data-in="to" value="'+esc(r.to)+'"></div></div>';
  }else{h+='<div style="height:12px"></div>';}
  h+='<div class="sum num"><div class="box"><div class="k">Entrate</div><div class="v in">'+fmt(inc)+'</div></div>'+
     '<div class="box"><div class="k">Spese</div><div class="v out">'+fmt(exp)+'</div></div>'+
     '<div class="box diff'+(diff<0?' neg':'')+'"><div class="k">Differenza · '+esc(b.label)+'</div><div class="v">'+(diff>0?'+':'')+fmt(diff)+'</div></div></div>';

  h+='<div class="sec"><h3>Dove sono andati i soldi</h3>';
  var any=false;
  for(i=0;i<S.tree.length;i++){
    var M=S.tree[i],isIn=M.id==='entrate',mt=0,j;
    for(j=0;j<list.length;j++)if(list[j].k===M.id)mt+=list[j].a;
    if(!mt)continue;any=true;
    var denom=isIn?inc:exp;
    h+='<div class="macrohd num"><span>'+esc(M.name)+'</span><span style="color:var('+(isIn?'--green':'--fg')+')">'+fmt(mt)+'</span></div>';
    for(j=0;j<M.micros.length;j++){
      var mi=M.micros[j],ut=0,k;
      for(k=0;k<list.length;k++)if(list[k].m===mi.id)ut+=list[k].a;
      if(!ut)continue;
      h+='<div class="brow m"><div class="l num"><span>'+esc(mi.name)+'</span><span>'+fmt(ut)+' <span style="color:var(--muted);font-weight:400;font-size:12px">'+Math.round(ut/(denom||1)*100)+'%</span></span></div><span class="bar'+(isIn?' in':'')+'"><i style="width:'+Math.max(2,Math.round(ut/(mt||1)*100))+'%"></i></span></div>';
      for(k=0;k<mi.subs.length;k++){
        var sb=mi.subs[k],st=0,q;
        for(q=0;q<list.length;q++)if(list[q].s===sb.id)st+=list[q].a;
        if(st)h+='<div class="brow s"><div class="l num"><span>'+esc(sb.name)+'</span><span>'+fmt(st)+'</span></div></div>';
      }
    }
  }
  if(!any)h+='<div class="empty">Nessun movimento in questo periodo.</div>';
  h+='</div>';

  h+='<div class="sec"><h3>Movimenti ('+list.length+')</h3>';
  if(list.length){
    list.sort(function(a,b2){return a.d<b2.d?1:a.d>b2.d?-1:0;});
    h+='<ul class="moves num">';
    var lim=Math.min(list.length,200);
    for(i=0;i<lim;i++){var x=list[i],isI=x.k==='entrate';
      h+='<li><span class="mdate">'+esc(shortDay(x.d))+'</span><span class="mwho"><b>'+esc(micro(x.k,x.m)?micro(x.k,x.m).name:'—')+'</b><small>'+esc(pathOf(x))+(x.n?' · '+esc(x.n):'')+'</small></span><span class="mamt'+(isI?' in':'')+'">'+(isI?'+':'−')+fmt(x.a)+'</span></li>';}
    h+='</ul>';
    if(list.length>lim)h+='<div class="hint">Mostrati gli ultimi '+lim+' movimenti. Restringi il periodo per vedere gli altri.</div>';
  }else h+='<div class="empty">Niente da mostrare.</div>';
  h+='</div>';

  h+='<div class="sec"><h3>Conto in alto</h3><div class="seg two"><button class="'+(S.settings.mode==='month'?'on':'')+'" data-act="mode" data-v="month">Mese selezionato</button><button class="'+(S.settings.mode==='all'?'on':'')+'" data-act="mode" data-v="all">Totale assoluto</button></div></div>';
  h+='<div class="foot">'+(P.mode==='cloud'?'I dati sono salvati nel tuo account e restano anche se cambi telefono.':'I dati sono salvati solo su questo dispositivo.')+'</div>';
  h+='<div style="height:80px"></div>';
  document.getElementById('report').innerHTML=h;
}

/* ---------- Schede ---------- */
function openSheet(s){ui.sheet=s;renderSheet();}
function closeSheet(){ui.sheet=null;var w=document.getElementById('sheetwrap');w.hidden=true;w.innerHTML='';}
function renderSheet(){
  var s=ui.sheet,w=document.getElementById('sheetwrap'),h='';
  if(!s){closeSheet();return;}
  if(s.type==='entry'){
    var M=macro(s.k),mi=micro(s.k,s.m),ex=s.id?entryById(s.id):null,isIn=s.k==='entrate';
    var opts='<option value="">Nessuna</option>';
    for(var i=0;i<mi.subs.length;i++)opts+='<option value="'+mi.subs[i].id+'"'+((ex?ex.s:s.s)===mi.subs[i].id?' selected':'')+'>'+esc(mi.subs[i].name)+'</option>';
    h='<div class="backdrop" data-act="close"></div><form class="sheet" data-form="entry" novalidate>'+
      '<h2>'+(ex?'Modifica':(isIn?'Nuova entrata':'Nuova spesa'))+'<small>'+esc(M.name+' › '+mi.name)+'</small></h2>'+
      '<label for="f-date">Data</label><input type="date" id="f-date" value="'+esc(ex?ex.d:today())+'">'+
      '<label for="f-amt">Importo (€)</label><input type="text" id="f-amt" inputmode="decimal" autocomplete="off" placeholder="0,00" value="'+(ex?amtToInput(ex.a):'')+'">'+
      (mi.subs.length?'<label for="f-sub">Sottocategoria</label><select id="f-sub">'+opts+'</select>':'')+
      '<label for="f-note">Note</label><textarea id="f-note" rows="2" placeholder="Facoltative">'+esc(ex?ex.n:'')+'</textarea>'+
      '<div class="err" id="f-err" role="alert"></div>'+
      '<div class="btns"><button type="submit" class="btn pri">Salva</button><button type="button" class="btn" data-act="close">Annulla</button>'+
      (ex?'<button type="button" class="btn del" data-act="delE" data-arm="Tocca ancora per eliminare">Elimina</button>':'')+'</div></form>';
  }else{
    var isSub=s.type==='sub',ex2=null,title,sub2='';
    var Mm=macro(s.k),Mi=isSub||s.type==='micro'?micro(s.k,s.m||s.id):null;
    if(s.type==='micro'){ex2=s.id?micro(s.k,s.id):null;title=ex2?'Modifica microcategoria':'Nuova microcategoria';sub2=Mm.name;}
    else{ex2=s.id?subOf(micro(s.k,s.m),s.id):null;title=ex2?'Modifica sottocategoria':'Nuova sottocategoria';sub2=Mm.name+' › '+micro(s.k,s.m).name;}
    var cnt=0;
    if(ex2){cnt=sum(function(e){return s.type==='micro'?e.m===ex2.id:e.s===ex2.id;});}
    var nEnt=0;if(ex2){for(var z=0;z<S.entries.length;z++){var en=S.entries[z];if(s.type==='micro'?en.m===ex2.id:en.s===ex2.id)nEnt++;}}
    var armTxt=s.type==='micro'?(nEnt?'Elimina anche '+nEnt+' voci: tocca ancora':'Tocca ancora per eliminare'):(nEnt?'Le '+nEnt+' voci restano nella micro: tocca ancora':'Tocca ancora per eliminare');
    h='<div class="backdrop" data-act="close"></div><form class="sheet" data-form="'+s.type+'" novalidate>'+
      '<h2>'+title+'<small>'+esc(sub2)+'</small></h2>'+
      '<label for="f-name">Nome</label><input type="text" id="f-name" autocomplete="off" maxlength="40" value="'+esc(ex2?ex2.name:'')+'">'+
      '<div class="err" id="f-err" role="alert"></div>'+
      '<div class="btns"><button type="submit" class="btn pri">Salva</button><button type="button" class="btn" data-act="close">Annulla</button>'+
      (ex2?'<button type="button" class="btn del" data-act="delN" data-arm="'+esc(armTxt)+'">Elimina</button>':'')+'</div></form>';
  }
  w.innerHTML=h;w.hidden=false;
  var f=document.getElementById(s.type==='entry'?'f-amt':'f-name');
  if(f&&!(s.id)){try{f.focus();}catch(e){}}
}
function revealPath(k,m,sId){ui.open['M:'+k]=true;ui.open['m:'+m]=true;if(sId)ui.open['s:'+sId]=true;}
function submitForm(form){
  var s=ui.sheet,err=document.getElementById('f-err');
  if(form.getAttribute('data-form')==='entry'){
    var d=document.getElementById('f-date').value,a=parseAmt(document.getElementById('f-amt').value);
    var subEl=document.getElementById('f-sub'),sId=subEl?subEl.value:'',n=document.getElementById('f-note').value.replace(/^\s+|\s+$/g,'');
    if(!d){err.textContent='Scegli una data.';return;}
    if(isNaN(a)){err.textContent='Scrivi un importo maggiore di zero, per esempio 12,50.';return;}
    var dirty={},ex=s.id?entryById(s.id):null;
    if(ex){dirty['m-'+ex.d.slice(0,7)]=1;ex.d=d;ex.a=a;ex.s=sId;ex.n=n;}
    else{S.entries.push({id:uid(),k:s.k,m:s.m,s:sId,d:d,a:a,n:n});}
    dirty['m-'+d.slice(0,7)]=1;
    revealPath(s.k,s.m,sId);ui.month=d.slice(0,7);
    closeSheet();markDirty(Object.keys(dirty));render();
  }else{
    var name=document.getElementById('f-name').value.replace(/^\s+|\s+$/g,'');
    if(!name){err.textContent='Scrivi un nome.';return;}
    if(s.type==='micro'){
      var M=macro(s.k),mi=s.id?micro(s.k,s.id):null;
      if(mi)mi.name=name;else{mi=mk(name);M.micros.push(mi);ui.open['M:'+s.k]=true;ui.open['m:'+mi.id]=true;}
    }else{
      var mi2=micro(s.k,s.m),sb=s.id?subOf(mi2,s.id):null;
      if(sb)sb.name=name;else{sb={id:uid(),name:name};mi2.subs.push(sb);revealPath(s.k,s.m,sb.id);}
    }
    closeSheet();markDirty(['tree']);render();
  }
}
function deleteEntry(){
  var s=ui.sheet,ex=entryById(s.id);if(!ex)return;
  var key='m-'+ex.d.slice(0,7);
  S.entries=S.entries.filter(function(e){return e.id!==s.id;});
  closeSheet();markDirty([key]);render();
}
function deleteNode(){
  var s=ui.sheet,dirty={tree:1},M=macro(s.k);
  if(s.type==='micro'){
    S.entries=S.entries.filter(function(e){if(e.m===s.id){dirty['m-'+e.d.slice(0,7)]=1;return false;}return true;});
    M.micros=M.micros.filter(function(m){return m.id!==s.id;});
  }else{
    var mi=micro(s.k,s.m);
    for(var i=0;i<S.entries.length;i++){if(S.entries[i].s===s.id){S.entries[i].s='';dirty['m-'+S.entries[i].d.slice(0,7)]=1;}}
    mi.subs=mi.subs.filter(function(b){return b.id!==s.id;});
  }
  closeSheet();markDirty(Object.keys(dirty));render();
}

/* ---------- Eventi ---------- */
function render(){
  var home=ui.view==='home';
  document.getElementById('topbar').hidden=!home;
  document.getElementById('home').hidden=!home;
  document.getElementById('report').hidden=home;
  if(home){renderTop();renderHome();}else renderReport();
}
function findAct(t){while(t&&t!==document){if(t.getAttribute&&t.getAttribute('data-act'))return t;t=t.parentNode;}return null;}
document.addEventListener('click',function(ev){
  var el=findAct(ev.target);if(!el)return;
  var a=el.getAttribute('data-act'),g=function(n){return el.getAttribute('data-'+n);};
  if(a==='tog'){var k=g('key');ui.open[k]=!ui.open[k];render();}
  else if(a==='report'){ui.view='report';ui.rep.month=ui.month;render();window.scrollTo(0,0);}
  else if(a==='home'){ui.view='home';render();window.scrollTo(0,0);}
  else if(a==='mprev'){ui.month=shiftMonth(ui.month,-1);render();}
  else if(a==='mnext'){ui.month=shiftMonth(ui.month,1);render();}
  else if(a==='mnow'){ui.month=today().slice(0,7);render();}
  else if(a==='addE'){openSheet({type:'entry',k:g('k'),m:g('m'),s:g('s')||''});}
  else if(a==='editE'){var e=entryById(g('id'));if(e)openSheet({type:'entry',k:e.k,m:e.m,s:e.s,id:e.id});}
  else if(a==='addM'){openSheet({type:'micro',k:g('k')});}
  else if(a==='editM'){openSheet({type:'micro',k:g('k'),id:g('id')});}
  else if(a==='addS'){openSheet({type:'sub',k:g('k'),m:g('m')});}
  else if(a==='editS'){openSheet({type:'sub',k:g('k'),m:g('m'),id:g('id')});}
  else if(a==='close'){closeSheet();}
  else if(a==='delE'||a==='delN'){
    if(!el.classList.contains('armed')){el.classList.add('armed');el.textContent=g('arm');}
    else if(a==='delE')deleteEntry();else deleteNode();
  }
  else if(a==='rp'){ui.rep.p=g('p');render();}
  else if(a==='rprev'||a==='rnext'){
    var n=a==='rprev'?-1:1;
    if(ui.rep.p==='month')ui.rep.month=shiftMonth(ui.rep.month,n);else ui.rep.year=String(+ui.rep.year+n);
    render();
  }
  else if(a==='mode'){S.settings.mode=g('v');markDirty(['tree']);render();}
});
document.addEventListener('change',function(ev){
  var t=ev.target,w=t.getAttribute&&t.getAttribute('data-in');
  if(w==='from'){ui.rep.from=t.value;render();}
  else if(w==='to'){ui.rep.to=t.value;render();}
});
document.addEventListener('submit',function(ev){
  var f=ev.target;if(f&&f.getAttribute&&f.getAttribute('data-form')){ev.preventDefault();submitForm(f);}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&ui.sheet)closeSheet();});

loadLocal();
render();
initCloud();
})();
</script>
